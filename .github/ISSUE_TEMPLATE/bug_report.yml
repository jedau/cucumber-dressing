name: 🐛 Bug Report
description: Report a bug or unexpected behavior in DRESSING
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the form below to help us investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Install DRESSING with '...'
        2. Run command '...'
        3. View generated report
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected to see...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, I saw...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: DRESSING Version
      description: Which version of DRESSING are you using?
      placeholder: '0.1.0'
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js Version
      description: Run `node --version` to check
      placeholder: 'v20.0.0'
    validations:
      required: true

  - type: dropdown
    id: install-method
    attributes:
      label: Installation Method
      description: How did you install DRESSING?
      options:
        - npm install cucumber-dressing
        - npm install -g cucumber-dressing
        - npx dressing
        - Cloned from GitHub
    validations:
      required: true

  - type: dropdown
    id: issue-area
    attributes:
      label: Issue Area
      description: Which area is affected?
      options:
        - CLI (command-line interface)
        - Report generation
        - HTML template/styling
        - Charts/statistics
        - JSON parsing
        - Screenshot handling
        - Theme (light/dark)
        - Other
    validations:
      required: true

  - type: textarea
    id: json-sample
    attributes:
      label: Sample JSON Structure (if relevant)
      description: Paste a sanitized sample of your Cucumber JSON file
      placeholder: |
        [
          {
            "id": "feature-id",
            "name": "Feature name",
            "elements": [...]
          }
        ]
      render: json

  - type: textarea
    id: cli-command
    attributes:
      label: CLI Command Used
      description: What command did you run?
      placeholder: |
        dressing --jsonFile test-results/cucumber-report.json --output report.html
      render: bash

  - type: textarea
    id: error-logs
    attributes:
      label: Error Logs
      description: Copy and paste any error messages or logs
      placeholder: Paste error logs here
      render: shell

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem

  - type: input
    id: os
    attributes:
      label: Operating System
      description: Which OS are you using?
      placeholder: 'Windows 11, macOS 14, Ubuntu 22.04'
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here
